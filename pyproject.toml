[project]
name = "graph-hallucinations"
version = "3.0.0"
requires-python = ">=3.12"

dependencies = [
  "dvc[s3]==3.59.1",
  "scikit-learn==1.6.1",
  "pydantic==2.11.3",
  "pytorch-lightning==2.5.1",
  "torch_geometric==2.6.1",
  "torch==2.6.0",
  "wandb==0.19.9",
  "omegaconf==2.3.0",
  "langchain==0.3.23",
  "langchain-community==0.3.21",
  "langchain-openai==0.3.12",
  "datasets==3.1.0",
  "accelerate==1.1.1",
  "transformers==4.47.0",
  "tensorboard==2.18.0",
  "pandas==2.2.3",
  "polars==1.27.1",
  "seaborn>=0.13.2",
  "tqdm>=4.66.4",
  "typer>=0.12.5",
  "tabulate>=0.9.0",
  "tuned-lens==0.2.0",
  "umap-learn==0.5.5",
  "hydra-core==1.3.2",
  "loguru==0.7.2",
  "python-dotenv==1.0.1",
  "jupyterlab>=4.2.5",
  "ipywidgets>=8.1.5",
  "pynvml==12.0.0",
  "pip>=25.2",
]

[dependency-groups]
dev = [
  "pre-commit>=3.8.0",
  "mypy>=1.15.0",
  "pytest==8.3.4",
]

# PyTorch indices for CPU and CUDA wheels. uv will choose an index based on markers below.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'"  },
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.3.4"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
